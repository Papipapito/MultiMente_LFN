<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>MM_LFN — Multi Mente</title>
<!-- Fichero generado por tools/hacer_parche.py: no lo edites a mano / generated file, do not edit. -->
<style>
  :root { --fondo:#f6f7f9; --texto:#1c2330; --suave:#5b6577; --caja:#fff; --borde:#c8cfda; --acento:#1d5fd1;
          --ok:#12713a; --mal:#b3261e; --okfondo:#e6f4ec; --malfondo:#fbe9e7; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#14181f; --texto:#e6e9ef; --suave:#9aa4b5; --caja:#1c222c; --borde:#3a4352; --acento:#6ea0ff;
            --ok:#6fd49a; --mal:#ff9a92; --okfondo:#14301f; --malfondo:#3a1c19; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:40rem; margin:0 auto; padding:2rem 16px 3rem; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  p { margin:.5rem 0; }
  .suave { color:var(--suave); }
  code { font:.9em ui-monospace,Consolas,monospace; word-break:break-all; }
  #zona { display:block; margin:1.25rem 0; padding:2rem 1rem; text-align:center; cursor:pointer;
          background:var(--caja); border:2px dashed var(--borde); border-radius:10px; }
  #zona:hover, #zona.encima, #zona:focus-within { border-color:var(--acento); }
  #zona input { position:absolute; opacity:0; width:1px; height:1px; }
  #resultado { display:none; padding:1rem; border-radius:10px; border:1px solid var(--borde); background:var(--caja); }
  #resultado.ok { display:block; background:var(--okfondo); border-color:var(--ok); }
  #resultado.mal { display:block; background:var(--malfondo); border-color:var(--mal); }
  #resultado strong { display:block; margin-bottom:.25rem; }
  #resultado.ok strong { color:var(--ok); } #resultado.mal strong { color:var(--mal); }
  button { margin-top:.75rem; padding:.6rem 1.1rem; font:inherit; font-weight:600; color:#fff; background:var(--acento);
           border:0; border-radius:8px; cursor:pointer; }
  button:focus-visible, #zona:focus-within { outline:3px solid var(--acento); outline-offset:2px; }
  footer { margin-top:2rem; font-size:.875rem; }
  footer ul { margin:.25rem 0; padding-left:1.25rem; }
</style>
</head>
<body>
<main>
  <h1 id="t-titulo"></h1>
  <p id="t-sub" class="suave"></p>
  <label id="zona"><input id="fichero" type="file"><span id="t-zona"></span></label>
  <div id="resultado" role="status" aria-live="polite"></div>
  <footer class="suave">
    <p id="t-pie"></p>
    <p id="t-versiones"></p>
    <ul id="lista-versiones"></ul>
  </footer>
</main>
<script>
"use strict";
// sha1 del original -> { nombre, tam_original, parcheado (sha1), tam_parcheado, ips (base64) }
const BASES = __BASES__;

// ---- nucleo (sin DOM; lo prueba tests/probar.py con node) ----
function sha1(bytes) {
  const h = [0x67452301, 0xEFCDAB89, 0x98BADCFE, 0x10325476, 0xC3D2E1F0];
  const l = bytes.length, total = (((l + 8) >> 6) + 1) << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(l / 0x20000000));
  dv.setUint32(total - 4, (l << 3) >>> 0);
  const w = new Uint32Array(80);
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 80; i++) { const x = w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16]; w[i] = (x << 1) | (x >>> 31); }
    let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4];
    for (let i = 0; i < 80; i++) {
      let f, k;
      if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
      else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const t = (((a << 5) | (a >>> 27)) + f + e + k + w[i]) >>> 0;
      e = d; d = c; c = ((b << 30) | (b >>> 2)) >>> 0; b = a; a = t;
    }
    h[0] = (h[0] + a) >>> 0; h[1] = (h[1] + b) >>> 0; h[2] = (h[2] + c) >>> 0;
    h[3] = (h[3] + d) >>> 0; h[4] = (h[4] + e) >>> 0;
  }
  return h.map(x => x.toString(16).padStart(8, "0")).join("");
}

function ipsBytes(shaOriginal) {
  const bin = atob(BASES[shaOriginal].ips), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function aplicarIps(datos, ips) {
  if (String.fromCharCode(...ips.subarray(0, 5)) !== "PATCH") throw new Error("not an IPS patch");
  let tam = datos.length, i = 5;
  const registros = [];
  while (String.fromCharCode(...ips.subarray(i, i + 3)) !== "EOF") {
    const off = (ips[i] << 16) | (ips[i + 1] << 8) | ips[i + 2];
    let n = (ips[i + 3] << 8) | ips[i + 4];
    i += 5;
    let dato;
    if (n) { dato = ips.subarray(i, i + n); i += n; }
    else { n = (ips[i] << 8) | ips[i + 1]; dato = new Uint8Array(n).fill(ips[i + 2]); i += 3; }
    registros.push([off, dato]);
    tam = Math.max(tam, off + n);
  }
  const out = new Uint8Array(tam);
  out.set(datos);
  for (const [off, dato] of registros) out.set(dato, off);
  return out;
}

// { estado: "original" | "parcheado" | "otro", sha, base }
function comprobar(datos) {
  const sha = sha1(datos);
  if (BASES[sha]) return { estado: "original", sha, base: BASES[sha] };
  const base = Object.values(BASES).find(b => b.parcheado === sha);
  return base ? { estado: "parcheado", sha, base } : { estado: "otro", sha, base: null };
}

// ---- pagina ----
if (typeof document !== "undefined") {
  const TXT = {
    es: {
      titulo: "Nombres largos para Multi Mente",
      sub: "Elige el MM.COM original de Multi Mente (2.07_A o 2.07A+ RC5) y descarga el MM.COM con nombres largos. Todo ocurre en tu navegador: el fichero no se sube a ningún sitio.",
      zona: "Suelta aquí tu MM.COM, o pulsa para elegirlo",
      pie: "Después copia el fichero resultante a la tarjeta como MM.COM, en la carpeta de Multi Mente (junto a MM.EXE y MM.CFG). Necesita Nextor 2.1 o 3.0.",
      versiones: "Versiones admitidas, sin tocar:",
      ok: "Hecho", okMsg: "Multi Mente %v: parche aplicado (%n bytes). Pulsa para descargar MM_LFN.COM.", descargar: "Descargar MM_LFN.COM",
      ya: "Ya está parcheado", yaMsg: "Este MM.COM (Multi Mente %v) ya lleva el parche de nombres largos.",
      mal: "No es un MM.COM original que conozca", malMsg: "Tu fichero tiene sha1 %s. El parche solo vale para las versiones de abajo, sin tocar: no sirve un MM.COM ya parcheado ni con las asociaciones cambiadas.",
    },
    en: {
      titulo: "Long file names for Multi Mente",
      sub: "Pick the original Multi Mente MM.COM (2.07_A or 2.07A+ RC5) and download the MM.COM with long file names. Everything happens in your browser: the file is not uploaded anywhere.",
      zona: "Drop your MM.COM here, or click to choose it",
      pie: "Then copy the result to the card as MM.COM, in the Multi Mente folder (next to MM.EXE and MM.CFG). Needs Nextor 2.1 or 3.0.",
      versiones: "Supported versions, untouched:",
      ok: "Done", okMsg: "Multi Mente %v: patch applied (%n bytes). Click to download MM_LFN.COM.", descargar: "Download MM_LFN.COM",
      ya: "Already patched", yaMsg: "This MM.COM (Multi Mente %v) already has the long-name patch.",
      mal: "Not an original MM.COM I know", malMsg: "Your file's sha1 is %s. The patch only fits the versions below, untouched: a MM.COM that is already patched or has edited associations will not do.",
    },
  };
  const L = TXT[(navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en"];
  document.documentElement.lang = L === TXT.es ? "es" : "en";
  document.getElementById("t-titulo").textContent = L.titulo;
  document.getElementById("t-sub").textContent = L.sub;
  document.getElementById("t-zona").textContent = L.zona;
  document.getElementById("t-pie").textContent = L.pie;
  document.getElementById("t-versiones").textContent = L.versiones;
  for (const [sha, b] of Object.entries(BASES)) {
    const li = document.createElement("li"), c = document.createElement("code");
    c.textContent = b.nombre + ": " + b.tam_original + " bytes, sha1 " + sha;
    li.append(c);
    document.getElementById("lista-versiones").append(li);
  }
  const res = document.getElementById("resultado"), zona = document.getElementById("zona"),
        fich = document.getElementById("fichero");

  function mostrar(clase, titulo, texto, boton) {
    res.className = clase;
    res.replaceChildren();
    const s = document.createElement("strong"); s.textContent = titulo; res.append(s, texto);
    if (boton) res.append(document.createElement("br"), boton);
  }

  async function procesar(archivo) {
    const datos = new Uint8Array(await archivo.arrayBuffer());
    const c = comprobar(datos);
    if (c.estado === "parcheado") return mostrar("ok", L.ya, L.yaMsg.replace("%v", c.base.nombre));
    if (c.estado === "otro") return mostrar("mal", L.mal, L.malMsg.replace("%s", c.sha));
    const nuevo = aplicarIps(datos, ipsBytes(c.sha));
    if (sha1(nuevo) !== c.base.parcheado) return mostrar("mal", L.mal, "Internal error / Error interno");
    const boton = document.createElement("button");
    boton.textContent = L.descargar;
    boton.onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([nuevo], { type: "application/octet-stream" }));
      a.download = "MM_LFN.COM";
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    };
    mostrar("ok", L.ok, L.okMsg.replace("%v", c.base.nombre).replace("%n", nuevo.length), boton);
  }

  fich.addEventListener("change", () => fich.files[0] && procesar(fich.files[0]));
  zona.addEventListener("dragover", e => { e.preventDefault(); zona.classList.add("encima"); });
  zona.addEventListener("dragleave", () => zona.classList.remove("encima"));
  zona.addEventListener("drop", e => {
    e.preventDefault(); zona.classList.remove("encima");
    if (e.dataTransfer.files[0]) procesar(e.dataTransfer.files[0]);
  });
}
</script>
</body>
