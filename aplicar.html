const CFG_LO = 238, CFG_HI = 872;

// ---- nucleo (sin DOM; lo prueba tests/probar.py con node) ----
function sha1(bytes) {
  const h = [0x67452301, 0xEFCDAB89, 0x98BADCFE, 0x10325476, 0xC3D2E1F0];
  const l = bytes.length, total = (((l + 8) >> 6) + 1) << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(l / 0x20000000));
  dv.setUint32(total - 4, (l << 3) >>> 0);
  const w = new Uint32Array(80);
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 80; i++) { const x = w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16]; w[i] = (x << 1) | (x >>> 31); }
    let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4];
    for (let i = 0; i < 80; i++) {
      let f, k;
      if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
      else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const t = (((a << 5) | (a >>> 27)) + f + e + k + w[i]) >>> 0;
      e = d; d = c; c = ((b << 30) | (b >>> 2)) >>> 0; b = a; a = t;
    }
    h[0] = (h[0] + a) >>> 0; h[1] = (h[1] + b) >>> 0; h[2] = (h[2] + c) >>> 0;
    h[3] = (h[3] + d) >>> 0; h[4] = (h[4] + e) >>> 0;
  }
  return h.map(x => x.toString(16).padStart(8, "0")).join("");
}

function sha1Cfg(datos) {
  const m = datos.slice();
  m.fill(0, Math.min(CFG_LO, m.length), Math.min(CFG_HI, m.length));
  return sha1(m);
}

function ipsBytes(base) {
  const bin = atob(base.ips), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function aplicarIps(datos, ips) {
  if (String.fromCharCode(...ips.subarray(0, 5)) !== "PATCH") throw new Error("not an IPS patch");
  let tam = datos.length, i = 5;
  const registros = [];
  while (String.fromCharCode(...ips.subarray(i, i + 3)) !== "EOF") {
    const off = (ips[i] << 16) | (ips[i + 1] << 8) | ips[i + 2];
    let n = (ips[i + 3] << 8) | ips[i + 4];
    i += 5;
    let dato;
    if (n) { dato = ips.subarray(i, i + n); i += n; }
    else { n = (ips[i] << 8) | ips[i + 1]; dato = new Uint8Array(n).fill(ips[i + 2]); i += 3; }
    registros.push([off, dato]);
    tam = Math.max(tam, off + n);
  }
  const out = new Uint8Array(tam);
  out.set(datos);
  for (const [off, dato] of registros) out.set(dato, off);
  return out;
}

// posiciones del byte CA/C3 del arreglo de Nextor: 3A E1 5F CB 4F (CA|C3) 4A 3E
function buscarArreglo(d) {
  const pos = [];
  for (let i = 0; i + 8 <= d.length; i++) {
    if (d[i] === 0x3A && d[i + 1] === 0xE1 && d[i + 2] === 0x5F && d[i + 3] === 0xCB && d[i + 4] === 0x4F &&
        (d[i + 5] === 0xCA || d[i + 5] === 0xC3) && d[i + 6] === 0x4A && d[i + 7] === 0x3E) { pos.push(i + 5); i += 7; }
  }
  return pos;
}

function versionDe(d) {
  const m = /MM v2\.\d\d[A-Za-z_+]{0,3}/.exec(new TextDecoder("latin1").decode(d));
  return m ? m[0] : null;
}

// estado: "original" (se le pueden poner los nombres largos) | "parcheado" (ya los lleva) | "otro"
// arreglo: "ya" | "falta" | null (no se encuentra el sitio, o esta mas de una vez)
function analizar(datos) {
  const sitios = buscarArreglo(datos), pos = sitios.length === 1 ? sitios[0] : null;
  const arreglo = pos === null ? null : (datos[pos] === 0xC3 ? "ya" : "falta");
  const arreglado = datos.slice();
  if (arreglo === "falta") arreglado[pos] = 0xC3;
  const h = sha1Cfg(arreglado);
  let base = BASES[h] || null, estado = base ? "original" : "otro";
  if (!base) {
    base = Object.values(BASES).find(b => b.parcheado_cfg === h) || null;
    estado = base ? "parcheado" : "otro";
  }
  return { estado, base, arreglo, arreglado };
}

// { salida (Uint8Array | null), nombre, hechos ["nextor", "lfn"], base, estado, arreglo, version }
function procesar(datos) {
  const a = analizar(datos);
  const r = { salida: null, nombre: "MM_LFN.COM", hechos: [], base: a.base, estado: a.estado, arreglo: a.arreglo,
              version: versionDe(datos) };
  if (a.estado === "original") {
    const salida = aplicarIps(a.arreglado, ipsBytes(a.base));
    if (sha1Cfg(salida) !== a.base.parcheado_cfg || salida.length !== a.base.tam_parcheado ||
        (sha1(datos) === a.base.original && sha1(salida) !== a.base.parcheado)) throw new Error("internal");
    r.salida = salida; r.hechos = (a.arreglo === "falta" ? ["nextor"] : []).concat(["lfn"]);
  } else if (a.arreglo === "falta") {  // ya con nombres largos o version desconocida: solo el arreglo de Nextor
    r.salida = a.arreglado; r.hechos = ["nextor"];
    r.nombre = a.estado === "parcheado" ? "MM_LFN.COM" : "MM_NEXTOR.COM";
  }
  return r;
}

if (typeof document !== "undefined") {
  const TXT = {

      zona: "Suelta aquí tu MM.COM, o pulsa para elegirlo",
      pie: "Después copia el fichero resultante a la tarjeta como MM.COM, en la carpeta de Multi Mente (junto a MM.EXE y MM.CFG). Necesita Nextor 2.1 o 3.0. Lo que hayas cambiado con CS se conserva.",
      versiones: "Versiones admitidas (el MM.COM de referencia; valen también con los ajustes de CS cambiados y con o sin el arreglo de Nextor):",
      ok: "Hecho", descargar: "Descargar %f",
      lfn: "Multi Mente %v: nombres largos puestos.", nextor: "Multi Mente %v: arreglo de Nextor y nombres largos puestos.",
      yaNextor: " Ya llevaba el arreglo de Nextor.",
      soloNextorLfn: "Multi Mente %v: ya llevaba los nombres largos, pero le faltaba el arreglo de Nextor: puesto.",
      soloNextor: "Versión %v: no la conozco para los nombres largos, así que solo he puesto el arreglo de Nextor (el de la wiki de MSX.org, sin probar en esta versión).",
      ya: "Ya está parcheado", yaMsg: "Este MM.COM (Multi Mente %v) ya lleva los nombres largos y el arreglo de Nextor.",
      mal: "No es un MM.COM que conozca", malMsg: "Tu fichero dice ser %v y tiene sha1 %s. Solo valen las versiones de abajo (tal cual o con los ajustes de CS cambiados); no sirve una versión distinta ni con el código cambiado.",
    },
    en: {
      titulo: "Multi Mente patcher: long file names and Nextor",
      sub: "Drop your Multi Mente MM.COM and download the MM.COM with long file names. If it lacks the Nextor fix, it is added. Everything happens in your browser: the file is not uploaded anywhere.",
      zona: "Drop your MM.COM here, or click to choose it",
      pie: "Then copy the result to the card as MM.COM, in the Multi Mente folder (next to MM.EXE and MM.CFG). Needs Nextor 2.1 or 3.0. What you changed with CS is kept.",
      versiones: "Supported versions (the reference MM.COM; they also fit with the CS settings changed, with or without the Nextor fix):",
      ok: "Done", descargar: "Download %f",
      lfn: "Multi Mente %v: long file names added.", nextor: "Multi Mente %v: Nextor fix and long file names added.",
      yaNextor: " It already had the Nextor fix.",
      soloNextorLfn: "Multi Mente %v: it already had the long file names but lacked the Nextor fix: added.",
      soloNextor: "Version %v: I do not know it for long file names, so I only added the Nextor fix (the one on the MSX.org wiki, untested on this version).",
      ya: "Already patched", yaMsg: "This MM.COM (Multi Mente %v) already has the long file names and the Nextor fix.",
      mal: "Not an MM.COM I know", malMsg: "Your file says it is %v and its sha1 is %s. Only the versions below fit (as they come, or with the CS settings changed); a different version or changed code will not do.",
    },
  };
  const L = TXT[(navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en"];
  document.documentElement.lang = L === TXT.es ? "es" : "en";
  document.getElementById("t-titulo").textContent = L.titulo;
  document.getElementById("t-sub").textContent = L.sub;
  document.getElementById("t-zona").textContent = L.zona;
  document.getElementById("t-pie").textContent = L.pie;
  document.getElementById("t-versiones").textContent = L.versiones;
  for (const b of Object.values(BASES)) {
    const li = document.createElement("li"), c = document.createElement("code");
    c.textContent = b.nombre + ": " + b.tam_original + " bytes, sha1 " + b.original;
    li.append(c);
    document.getElementById("lista-versiones").append(li);
  }
  const res = document.getElementById("resultado"), zona = document.getElementById("zona"),
        fich = document.getElementById("fichero");

  function mostrar(clase, titulo, texto, boton) {
    res.className = clase;
    res.replaceChildren();
    const s = document.createElement("strong"); s.textContent = titulo; res.append(s, texto);
    if (boton) res.append(document.createElement("br"), boton);
  }

  async function procesarFichero(archivo) {
    const datos = new Uint8Array(await archivo.arrayBuffer());
    let r;
    try { r = procesar(datos); } catch (e) { return mostrar("mal", L.mal, "Internal error / Error interno"); }
    const nombreVer = r.base ? r.base.nombre : (r.version || "?");
    if (!r.salida) {
      if (r.estado === "parcheado") return mostrar("ok", L.ya, L.yaMsg.replace("%v", nombreVer));
      return mostrar("mal", L.mal, L.malMsg.replace("%v", r.version || "?").replace("%s", sha1(datos)));
    }
    const lfn = r.hechos.includes("lfn"), nex = r.hechos.includes("nextor");
    let texto;
    if (lfn) texto = (nex ? L.nextor : L.lfn).replace("%v", nombreVer) + (!nex && r.arreglo === "ya" ? L.yaNextor : "");
    else texto = (r.estado === "parcheado" ? L.soloNextorLfn : L.soloNextor).replace("%v", nombreVer);
    const salida = r.salida, nombre = r.nombre;
    const boton = document.createElement("button");
    boton.textContent = L.descargar.replace("%f", nombre);
    boton.onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([salida], { type: "application/octet-stream" }));
      a.download = nombre;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    };
    mostrar("ok", L.ok, texto + " (" + salida.length + " bytes)", boton);
  }

  fich.addEventListener("change", () => fich.files[0] && procesarFichero(fich.files[0]));
  zona.addEventListener("dragover", e => { e.preventDefault(); zona.classList.add("encima"); });
  zona.addEventListener("dragleave", () => zona.classList.remove("encima"));
  zona.addEventListener("drop", e => {
    e.preventDefault(); zona.classList.remove("encima");
    if (e.dataTransfer.files[0]) procesarFichero(e.dataTransfer.files[0]);
  });
}
